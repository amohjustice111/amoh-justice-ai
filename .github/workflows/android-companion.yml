name: Build Justice AI Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-justice-ai/**'
      - '.github/workflows/android-companion.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-justice-ai
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: justice-ai-android-debug-apk
          path: android-justice-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
